name: Flutter Web Deploy to GitHub Pages

on:
  push:
    branches:
      - main # 메인 브랜치에 코드가 push될 때 실행됩니다.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 가져오기
      - uses: actions/checkout@v3

      # 2. Java 설치 (Flutter 실행에 필요)
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      # 3. Flutter 환경 설정
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # flutter-version: '3.19.0' # 특정 버전이 필요하면 입력하세요.

      # 4. 의존성 패키지 설치
      - name: Install dependencies
        run: flutter pub get

      # 5. Flutter 웹 빌드 (CanvasKit 렌더러 사용으로 고화질 설정)
      - name: Build Web
        run: flutter build web --release --web-renderer canvaskit --base-href "/${{ github.event.repository.name }}/"

      # 6. GitHub Pages로 배포
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
